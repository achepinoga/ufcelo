<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Paper background -->
  <rect width="32" height="32" fill="#F2EFE6"/>

  <!-- Left red accent bar -->
  <rect x="4" y="5" width="3" height="22" fill="#B91C1C"/>

  <!-- E letterform built from rectangles (Bebas-style, no font needed) -->
  <!-- Top bar -->
  <rect x="7" y="5" width="18" height="4" fill="#1A1A1A"/>
  <!-- Middle bar -->
  <rect x="7" y="14" width="14" height="3.5" fill="#1A1A1A"/>
  <!-- Bottom bar -->
  <rect x="7" y="23" width="18" height="4" fill="#1A1A1A"/>
  <!-- Vertical spine -->
  <rect x="7" y="5" width="3.5" height="22" fill="#1A1A1A"/>
</svg>
