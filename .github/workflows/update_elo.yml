name: Update UFC Elo Ratings

on:
  schedule:
    # Runs every Sunday at 9am UTC — day after most UFC/UFC Fight Night events
    - cron: "0 9 * * 0"
  workflow_dispatch:
    # Also allows manual trigger from the GitHub Actions tab

permissions:
  contents: write   # needed to commit state.json back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # initial bootstrap can take ~40 minutes

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Elo update
        run: python update.py

      - name: Commit updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json leaderboard.csv upset_index.csv strength_of_schedule.csv fights_log.csv
          # Only commit if something changed
          git diff --staged --quiet || git commit -m "Update Elo ratings [$(date -u +'%Y-%m-%d')]"
          git push
